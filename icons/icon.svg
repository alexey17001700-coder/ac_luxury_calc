<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1120"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dda6"/>
      <stop offset="0.5" stop-color="#e8c37a"/>
      <stop offset="1" stop-color="#c9a24d"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde9ff"/>
      <stop offset="1" stop-color="#3aa0e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3aa0e0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3aa0e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#gold)" stroke-opacity="0.45" stroke-width="4"/>

  <!-- кондиционер -->
  <rect x="96" y="150" width="320" height="104" rx="26" fill="#e9eef7"/>
  <rect x="96" y="150" width="320" height="104" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
  <rect x="120" y="176" width="272" height="20" rx="10" fill="#0a0e1a" fill-opacity="0.28"/>
  <rect x="120" y="212" width="272" height="24" rx="10" fill="#0a0e1a" fill-opacity="0.12"/>
  <circle cx="378" cy="182" r="9" fill="#7fd4ff"/>

  <!-- потоки воздуха -->
  <g stroke="url(#ice)" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M160 286 v46"/>
    <path d="M256 286 v62"/>
    <path d="M352 286 v46"/>
  </g>

  <!-- снежинка -->
  <g transform="translate(256,410)" stroke="url(#gold)" stroke-width="11" stroke-linecap="round">
    <path d="M0 -46 V46"/>
    <path d="M-40 -23 L40 23"/>
    <path d="M-40 23 L40 -23"/>
